<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#00121a"/>
    </linearGradient>
    <style>
      .label{font:16px/1.2 Arial, Helvetica, sans-serif; fill:#e6f2ff}
      .title{font:20px/1.2 Arial, Helvetica, sans-serif; fill:#ffd966; font-weight:700}
      .small{font:12px/1.2 Arial, Helvetica, sans-serif; fill:#bcd}
      .stroke{stroke:#88c0ff; stroke-width:2; fill:none}
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- Criostato (cylinder) -->
  <g transform="translate(900,200)">
    <rect x="-70" y="0" width="140" height="380" rx="16" fill="#2b3640" stroke="#7aa2ff" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="70" ry="18" fill="#3b4650" stroke="#7aa2ff" stroke-width="2"/>
    <ellipse cx="0" cy="380" rx="70" ry="18" fill="#111827" stroke="#22324a" stroke-width="2"/>
    <text x="-60" y="-10" class="label">Criostato</text>
    <text x="-60" y="10" class="small">(Dilution Refrigerator)</text>
  </g>

  <!-- Bloch sphere -->
  <g transform="translate(380,360)">
    <circle cx="0" cy="0" r="160" fill="rgba(255,255,255,0.03)" stroke="#9be7ff" stroke-width="2"/>
    <!-- equator -->
    <ellipse cx="0" cy="0" rx="160" ry="40" fill="none" stroke="#66c2ff" stroke-width="1.6"/>
    <!-- z-axis -->
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#9be7ff" stroke-width="1.6" stroke-dasharray="4 4"/>
    <!-- state vector -->
    <line x1="0" y1="0" x2="110" y2="-80" stroke="#ffd966" stroke-width="3" stroke-linecap="round"/>
    <circle cx="110" cy="-80" r="8" fill="#ffd966" stroke="#ffda79" stroke-width="1"/>
    <text x="-30" y="-190" class="title">Bloch Sphere</text>
    <text x="-30" y="-170" class="small">α|0⟩ + β|1⟩</text>
  </g>

  <!-- Isolation layer between Bloch and Criostato -->
  <path d="M 520 200 C 660 120, 780 120, 860 200" fill="none" stroke="#7ef0c7" stroke-width="6" opacity="0.28"/>
  <text x="600" y="160" class="label">Isolation: Lacre 7.1 (perímetro)</text>

  <!-- Cable XLR -->
  <g transform="translate(420,500)">
    <rect x="-220" y="-10" width="160" height="20" rx="4" fill="#0b3a2e" stroke="#1fbf8a"/>
    <text x="-210" y="5" class="small">Shure XLR +48V (phantom)</text>
    <line x1="-60" y1="0" x2="300" y2="-120" stroke="#1fbf8a" stroke-width="4"/>
  </g>

  <!-- Labels and legend -->
  <rect x="40" y="40" width="360" height="180" rx="8" fill="#071226" stroke="#2b6f9e"/>
  <text x="60" y="70" class="title">LPL_JONSON_QUANTUM_SHIELD</text>
  <text x="60" y="100" class="label">Legend</text>
  <text x="60" y="125" class="small">• Bloch Sphere — qubit superposition</text>
  <text x="60" y="145" class="small">• Criostato — dilution refrigerator (thermal isolation)</text>
  <text x="60" y="165" class="small">• Isolation — Lacre 7.1 perimeter</text>
  <text x="60" y="185" class="small">• Shure XLR +48V — analog path with phantom power</text>

  <!-- Footer telemetry -->
  <text x="40" y="760" class="small">BER=0 | JITTER=0ns | LATENCY=12ms | S0=0</text>

</svg>
